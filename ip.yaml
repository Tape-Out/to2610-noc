name: to2610-noc
version: 0.1.0
spec: '0.1'
kind: ip
lang: verilog
identity:
  slug: to2610-noc
  display_name: Four cores on a two-by-two mesh
  summary: 'A four-core chip for the ECOS 2610 shuttle: four Hazard3 cores, one on each node of a two-by-two mesh network, exchanging messages through per-core mailboxes and sharing the off-chip flash, SDRAM and serial port of the to2610-kvc board.'
  category: soc
  subcategories:
  - riscv
  ip_family: hazard3
  integration_profile: []
  maturity: simulated
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
deps:
  gf180mcu-kianv-rv32ima-sv32: ^0.1
  to2610-kvc: ^0.1
  hazard3: ^0.1
  noc: ^0.1
emit:
- kind: foreign
  lang: sv
  top: chip_core
  # 源码树是拼出来的：黑盒仓拼好的那一份（to2610-kvc 的那一颗）套上本仓的补丁，加 Hazard3、网格与信箱。
  # 信箱是 box/NocBox.bsv，由 htest/setup.sh 用 bsc 连同 noc 库编成 Verilog 再放进来；hwsrc 里只有 Verilog
  setup: src
  rtl:
  - build/src/chip_core.sv
  - { glob: "build/src/*.v" }
  - build/src/sdram/mt48lc16m16a2_ctrl.v
  - { glob: "build/src/kianv_harris_edition/*.v" }
  - { glob: "build/src/hazard3/*.v" }
  - { glob: "build/src/hazard3/arith/*.v" }
  includes:
  - build/src
  - build/src/kianv_harris_edition
  - build/src/hazard3
  # 片外存储与外设那一半与 to2610-kvc 交付的那一颗同一组取值
  defines:
    SYSTEM_CLK: 50000000
    NUM_ENTRIES_ITLB: 32
    NUM_ENTRIES_DTLB: 32
    TRP_NS: 15
    TRCD_NS: 15
    TRFC_NS: 66
    TWR_NS: 15
    CAS: 2
    TREFI_NS: 7800
    BYPASS_CACHES: 1
    SYNTHESIS: 1
  clock:
    port: clk
  reset:
    port: rst_n
    active: low
    sync: false
  ports:
  # 引脚与 to2610-kvc 逐位相同：上游并成的那条 54 位双向焊盘总线
  - endpoint: pads
    kind: physical
    type: KianvPads
    map:
      i: bidir_in
      o: bidir_out
      oe: bidir_oe
      cs: bidir_cs
      sl: bidir_sl
      ie: bidir_ie
      pu: bidir_pu
      pd: bidir_pd
  limits:
  - 网格只走核间报文；片外的 Flash、SDRAM 与外设经一个四路仲裁共用，换人要空三拍
  - 每个核私有 6 MiB，四核共享 8 MiB；越出这两段的访问判出错
  - 只有 0 号核接着串口的中断；其余核要说的话经网格发给它
  - SDRAM 固定 32 MiB、主频固定 50 MHz、没有 JTAG，同 to2610-kvc
asic:
  top: to2610_noc
  frame: mpc
  mhz: 50
  flow: syn_sta
  # 四个核的布线后等价比对在托管机上到六小时的时限也没有结束；布线前的那一道照跑
  skip: [postRouteLec]
  # 引脚与 to2610-kvc 逐位相同，原样占 payload 的 0 到 53 位：用同一块底板
  pads:
  - { in: bidir_in, out: bidir_out, oe: bidir_oe }
  unused: [bidir_cs, bidir_sl, bidir_ie, bidir_pu, bidir_pd]
tasks:
  src:
    desc: 拼源码树：黑盒仓拼好的那一份套上 patch/noc.patch，加 Hazard3、bsc 编出来的信箱与网格、本仓 hwsrc 里的模块
    run: bash htest/setup.sh {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.hazard3}} {{dep.noc}}
  chip:
    desc: 出流片的 .v，在它上面跑整片测试
    run: bash htest/chip.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.to2610-kvc}}
    timeout: 14400
  design-faults:
    desc: 把仲裁、信箱、CLINT 的排法里的一处改错、重出 .v：四核的那两段测试里管这一处的那一句要红，十处
    run: bash htest/design-faults.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.to2610-kvc}}
    timeout: 7200
test:
  upstream:
  - { name: chip, task: chip, timeout: 14400 }
  - { name: design-faults, task: design-faults, timeout: 7200 }
targets:
  foreign:
    driver: foreign
