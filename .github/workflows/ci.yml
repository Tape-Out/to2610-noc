name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dep_refs:
        description: 依赖取哪个分支（空格分隔的 仓=分支），不写取各仓的默认分支。依赖的提交还没并进它的主分支时，先对着它验一遍
        default: ''
jobs:
  ip:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 整片测试：bsc 把信箱与网格编成 Verilog，ran asic 用 sv2v 与 yosys 展平出交付的 .v，
      # 测试台跑在 Verilator 上，程序用裸机的 RISC-V GCC 编
      apt: yosys verilator gcc-riscv64-unknown-elf
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
  # 两份 Linux 同时起到 shell 要仿一天上下，与整片测试并排另起一串：先备料（编仿真器、拼镜像，fdtput 改设备树），
  # 再八棒接力，每棒跑满四个半小时交断点，走完了余下的棒直接收工。
  # 接力各棒用备料那一棒编好的仿真器，yosys 与 sv2v 是给每个作业开头都要跑的 setup（拼源码树）用的
  linux-0:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator gcc-riscv64-unknown-elf device-tree-compiler
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-prep
      keep: build/linux-run
      stage: linux-0
  linux-1:
    needs: linux-0
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-0
      keep: build/linux-run
      stage: linux-1
  linux-2:
    needs: linux-1
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-1
      keep: build/linux-run
      stage: linux-2
  linux-3:
    needs: linux-2
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-2
      keep: build/linux-run
      stage: linux-3
  linux-4:
    needs: linux-3
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-3
      keep: build/linux-run
      stage: linux-4
  linux-5:
    needs: linux-4
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-4
      keep: build/linux-run
      stage: linux-5
  linux-6:
    needs: linux-5
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-5
      keep: build/linux-run
      stage: linux-6
  linux-7:
    needs: linux-6
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-6
      keep: build/linux-run
      stage: linux-7
  linux-8:
    needs: linux-7
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-7
      keep: build/linux-run
      stage: linux-8
  # 两份 Linux 都到 shell 之后，从最后一棒交出的断点接着跑
  linux-box:
    needs: linux-8
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-box
      restore: build/linux-run
      from: linux-8
      stage: linux-box
